<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure GenAI - GenAI Security & Safety Newsletter</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Stay ahead of AI threats with Secure GenAI - your weekly newsletter covering GenAI security vulnerabilities, safety research, and emerging risks from leading experts." />
    <meta name="keywords" content="AI security, GenAI safety, artificial intelligence, cybersecurity, machine learning safety, AI threats, security research" />
    <meta name="author" content="Secure GenAI" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Secure GenAI - GenAI Security & Safety Newsletter" />
    <meta property="og:description" content="Stay ahead of AI threats with weekly insights on GenAI security, safety research, and emerging risks." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://securegenai.github.io" />
    <meta property="og:image" content="https://securegenai.github.io/og-image.png" />
    <meta property="og:site_name" content="Secure GenAI" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Secure GenAI - GenAI Security & Safety Newsletter" />
    <meta name="twitter:description" content="Stay ahead of AI threats with weekly insights on GenAI security, safety research, and emerging risks." />
    <meta name="twitter:image" content="https://securegenai.github.io/og-image.png" />
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://securedgenai.substack.com" />
    <link rel="preconnect" href="https://substackcdn.com" />
    <link rel="dns-prefetch" href="https://substack-post-media.s3.amazonaws.com" />
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://securedgenai.substack.com; connect-src 'self' https:; object-src 'none'; base-uri 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Secure GenAI",
      "description": "Your weekly source for GenAI security & safety intelligence",
      "url": "https://securegenai.github.io",
      "publisher": {
        "@type": "Organization",
        "name": "Secure GenAI",
        "url": "https://securegenai.github.io"
      },
      "potentialAction": {
        "@type": "SubscribeAction",
        "target": "https://securedgenai.substack.com/subscribe"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
